<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Prediction Overlay - Simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Francois+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animation.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        .confetti-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 100;
        }
        .confetti-piece {
            position: absolute;
            width: 12px;
            height: 19px;
            top: 0;
            background: var(--confetti-color);
            opacity: 0.9;
            animation: confetti-fall var(--fall-duration, 3s) linear;
            z-index: 100;
            transition: background 1s ease-in;
            clip-path: polygon(50% 30%, 0% 80%, 100% 100%);
        }
        .confetti-piece:nth-child(1) { left: 10%; --confetti-color: #ed0677; --fall-duration: 3s; }
        .confetti-piece:nth-child(2) { left: 25%; --confetti-color: #871668; --fall-duration: 4s; }
        .confetti-piece:nth-child(3) { left: 40%; --confetti-color: #92278f; --fall-duration: 3.5s; }
        .confetti-piece:nth-child(4) { left: 60%; --confetti-color: #d80b8c; --fall-duration: 2.5s; }
        .confetti-piece:nth-child(5) { left: 80%; --confetti-color: #812990; --fall-duration: 2s; }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            3% { opacity: 1; }
            74% { opacity: 0; }
            100% { transform: translateY(50vh) rotate(760deg); opacity: 0; }
        }
    </style>
</head>
<body>
<div id="animation">
    <div class="confetti-wrapper" id="confettianimation"></div>
</div>

<script type="text/javascript">
    var globalWidth = 0;
    var intervalForTimer;
    var intervalForResults;

    function playTheStartSound() {
        var audio = new Audio('start.mp3');
        audio.volume = 0.7;
        audio.play().catch(() => {});
    }
    function playTheLockedSound() {
        var audio = new Audio('locked.mp3');
        audio.volume = 0.7;
        audio.play().catch(() => {});
    }
    function playTheEndedSound() {
        var audio = new Audio('ended.mp3');
        audio.volume = 0.7;
        audio.play().catch(() => {});
    }

    function clearOldElements() {
        const container = document.getElementById('animation');
        container.querySelectorAll('#outcomebar, #predtitle, #resultsdiv, #timerdiv, #lockeddiv, #paiddiv, #refundeddiv').forEach(el => el.remove());
        container.querySelectorAll('.confetti-piece').forEach(el => el.remove());
        if (typeof intervalForTimer !== 'undefined') clearInterval(intervalForTimer);
        if (typeof intervalForResults !== 'undefined') clearInterval(intervalForResults);
        container.style.opacity = "0%";
        container.style.top = "250px";
    }

    function dimTheBars() {
        document.querySelectorAll('#outcomebar, #predtitle, #resultsdiv').forEach(el => el.style.opacity = "69%");
    }

    function fadeoutTheBars() {
        document.querySelectorAll('#outcomebar, #predtitle, #resultsdiv, #timerdiv').forEach(el => el.style.opacity = "0%");
    }

    function fadeinEverything() {
        document.querySelectorAll('#outcomebar').forEach(el => el.style.opacity = "96%");
        const title = document.getElementById('predtitle');
        if (title) title.style.opacity = "100%";
        const container = document.getElementById('animation');
        container.style.opacity = "100%";
        container.style.top = "150px";
    }

    function addTheBarsMoveTimer() {
        const timer = document.getElementById('timerdiv');
        if (!timer) return;
        const bars = document.querySelectorAll('div[id^="outcomebar"]');
        if (!bars.length) return;
        const firstBar = bars[0];
        const lastBar = bars[bars.length - 1];
        const spanWidth = (lastBar.offsetLeft + lastBar.offsetWidth) - firstBar.offsetLeft;
        const centerPoint = firstBar.offsetLeft + (spanWidth / 2);
        timer.style.left = centerPoint + 'px';
    }

    function showTheTimer(seconds) {
        const container = document.getElementById('animation');
        const newTimerDiv = document.createElement('div');
        newTimerDiv.setAttribute('id', 'timerdiv');
        container.appendChild(newTimerDiv);
        addTheBarsMoveTimer();

        newTimerDiv.style.opacity = "0";
        newTimerDiv.style.transform = 'translateX(-50%) scale(2) rotate(-25deg)';

        let remainingSeconds = seconds;
        const m = Math.floor(remainingSeconds / 60);
        const s = remainingSeconds % 60;
        newTimerDiv.innerHTML = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

        requestAnimationFrame(() => {
            newTimerDiv.style.opacity = "1";
            newTimerDiv.style.transform = 'translateX(-50%) scale(1) rotate(0deg)';
        });

        intervalForTimer = window.setInterval(() => {
            remainingSeconds--;
            if (remainingSeconds <= 0) {
                clearInterval(intervalForTimer);
                newTimerDiv.style.opacity = "0";
                newTimerDiv.style.transform = 'translateX(-50%) translateY(-20px) scale(0.5) rotate(0deg)';
                return;
            }
            const min = Math.floor(remainingSeconds / 60);
            const sec = remainingSeconds % 60;
            newTimerDiv.innerHTML = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }, 1000);
    }

    function countUpToCPointsNumber(className, stones, title, percent, totalPoints) {
        const counterElement = document.querySelector('.' + className);
        if (!counterElement) return;

        let currentNumber = 0;
        const targetNumber = stones;
        const duration = 1000;
        const interval = 10;
        const increment = targetNumber / (duration / interval);

        const timerCP = setInterval(() => {
            currentNumber += increment;
            if (currentNumber >= targetNumber) {
                currentNumber = targetNumber;
                clearInterval(timerCP);
            }
            const cpIcon = '<svg viewBox="0 0 20 20" style="width:0.95em;height:0.95em;vertical-align:-0.12em;display:inline-block;filter:drop-shadow(1px 1px 2px rgba(0,0,0,0.4));" fill="none"><circle cx="10" cy="10" r="7.5" stroke="#ffffff" stroke-width="2.2"/><path d="M10 5.8 A4.2 4.2 0 0 1 14.2 10" stroke="#ffffff" stroke-width="2.2"/></svg>';
            counterElement.innerHTML = `${Math.round(currentNumber).toLocaleString()} ${cpIcon} (${percent}%)`;
        }, interval);
    }

    function formatCompactPoints(points) {
        const abs = Math.abs(points);
        if (abs >= 1000000) return parseFloat((abs / 1000000).toFixed(2)) + 'M';
        if (abs >= 1000) return parseFloat((abs / 1000).toFixed(1)) + 'K';
        return abs.toString();
    }

    function startScrollingResultsColumn(colElement, entries, isWinner, durationMs) {
        if (!entries.length) return;
        const rowHeight = 28;
        const viewHeight = 140;
        const track = document.createElement('div');
        track.className = 'results-track';

        entries.forEach(entry => {
            const row = document.createElement('div');
            row.className = 'result-row';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'result-name';
            nameSpan.textContent = entry.name;

            const amountSpan = document.createElement('span');
            amountSpan.className = 'result-amount ' + (isWinner ? 'result-win' : 'result-loss');
            amountSpan.textContent = (isWinner ? '+' : '-') + formatCompactPoints(entry.amount);

            row.appendChild(nameSpan);
            row.appendChild(amountSpan);
            track.appendChild(row);
        });

        const totalHeight = entries.length * rowHeight;
        track.style.transform = `translateY(${viewHeight}px)`;
        colElement.appendChild(track);

        void track.offsetHeight;

        requestAnimationFrame(() => {
            track.style.transition = `transform ${durationMs}ms linear`;
            track.style.transform = `translateY(-${totalHeight}px)`;
        });
    }

    function runCycle() {
        clearOldElements();

        const container = document.getElementById('animation');
        globalWidth = container.offsetWidth || 1600;

        const titleDiv = document.createElement('div');
        titleDiv.setAttribute('id', 'predtitle');
        titleDiv.textContent = 'WILL WE WIN THIS GAME?';
        container.appendChild(titleDiv);

        const titles = ['BELIEVE', 'DOUBT'];
        const numberOfDivs = 2;
        const startWidth = Math.floor((globalWidth * 0.92) / numberOfDivs);

        for (let i = 0; i < numberOfDivs; i++) {
            const bar = document.createElement('div');
            bar.textContent = titles[i];
            bar.classList.add('outcomebar-' + i);
            bar.setAttribute('id', 'outcomebar');
            container.appendChild(bar);

            const initialContentWidth = bar.offsetWidth;
            bar.setAttribute('data-initial-width', initialContentWidth);
            bar.style.width = Math.max(initialContentWidth, startWidth) + 'px';

            const cp = document.createElement('div');
            cp.classList.add('outcomecp-' + i);
            bar.appendChild(cp);
        }

        showTheTimer(10);
        fadeinEverything();
        playTheStartSound();

        // 1. Simulate bets coming in after 3s
        setTimeout(() => {
            const totalPoints = 50000;
            const b0 = 35000;
            const b1 = 15000;
            countUpToCPointsNumber('outcomecp-0', b0, 'BELIEVE', 70, totalPoints);
            countUpToCPointsNumber('outcomecp-1', b1, 'DOUBT', 30, totalPoints);

            const bar0 = document.querySelector('.outcomebar-0');
            const bar1 = document.querySelector('.outcomebar-1');
            if (bar0) bar0.style.width = Math.max(parseInt(bar0.getAttribute('data-initial-width')), (b0 / totalPoints) * (globalWidth * 0.92)) + 'px';
            if (bar1) bar1.style.width = Math.max(parseInt(bar1.getAttribute('data-initial-width')), (b1 / totalPoints) * (globalWidth * 0.92)) + 'px';
            addTheBarsMoveTimer();
        }, 3000);

        // 2. Lock prediction at 10s
        setTimeout(() => {
            const newLockedDiv = document.createElement('div');
            newLockedDiv.setAttribute('id', 'lockeddiv');
            newLockedDiv.textContent = 'LOCKED!';
            container.appendChild(newLockedDiv);
            playTheLockedSound();

            setTimeout(() => {
                newLockedDiv.style.opacity = '1';
                newLockedDiv.style.transform = 'scale(1.2) rotate(-10deg) skew(0deg)';
                dimTheBars();
            }, 150);
            setTimeout(() => {
                newLockedDiv.style.opacity = '0';
                newLockedDiv.style.transform = 'scale(0.8) rotate(0deg)';
            }, 4000);
            setTimeout(() => newLockedDiv.remove(), 4500);
        }, 10000);

        // 3. Resolve & Pay Out at 15s
        setTimeout(() => {
            container.style.top = "150px";
            const titleHide = document.getElementById('predtitle');
            if (titleHide) titleHide.style.opacity = "0%";

            const newPaidDiv = document.createElement('div');
            newPaidDiv.setAttribute('id', 'paiddiv');
            newPaidDiv.textContent = 'PAID!';
            container.appendChild(newPaidDiv);
            playTheEndedSound();

            setTimeout(() => {
                newPaidDiv.style.opacity = '100%';
                newPaidDiv.style.transform = 'scale(2) rotate(-23deg)';
            }, 150);
            setTimeout(() => {
                newPaidDiv.style.opacity = '0%';
                newPaidDiv.style.transform = 'scale(1) rotate(-18deg)';
            }, 4000);
            setTimeout(() => newPaidDiv.remove(), 4500);

            const bars = container.querySelectorAll('#outcomebar');
            const firstBar = bars[0];
            const lastBar = bars[bars.length - 1];
            const barSpanWidth = (firstBar && lastBar)
                ? ((lastBar.offsetLeft + lastBar.offsetWidth) - firstBar.offsetLeft)
                : Math.floor(globalWidth * 0.92);

            const resultsDiv = document.createElement('div');
            resultsDiv.setAttribute('id', 'resultsdiv');
            resultsDiv.style.left = (firstBar ? firstBar.offsetLeft : 0) + 'px';
            resultsDiv.style.width = barSpanWidth + 'px';

            const leftCol = document.createElement('div');
            leftCol.className = 'results-col results-col-left';

            const rightCol = document.createElement('div');
            rightCol.className = 'results-col results-col-right';

            resultsDiv.appendChild(leftCol);
            resultsDiv.appendChild(rightCol);
            container.appendChild(resultsDiv);

            const bar1 = document.querySelector('.outcomebar-1');
            if (bar1) bar1.style.backgroundImage = 'none', bar1.style.backgroundColor = 'rgba(204, 204, 204, 0.5)';

            const mockWinners = [
                { name: 'Hadidas', amount: 12500 },
                { name: 'S1rLemon', amount: 8200 },
                { name: 'Aegis', amount: 4100 },
                { name: 'Jubhioc', amount: 1500 }
            ];
            const mockLosers = [
                { name: 'Crypto', amount: 7500 },
                { name: 'Unter', amount: 5000 },
                { name: 'Hilarium', amount: 2500 }
            ];

            startScrollingResultsColumn(leftCol, mockWinners, true, 8000);
            startScrollingResultsColumn(rightCol, mockLosers, false, 8000);
        }, 15000);

        // 4. Repeat cycle
        setTimeout(runCycle, 26000);
    }

    window.onload = runCycle;
</script>
</body>
</html>
